name: Validate grouped component decomposition
on:
  push:
    branches: [validation/manifold-decomposition-20261119]
permissions:
  contents: read
concurrency:
  group: validation-manifold-decomposition-20261119
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/manifold
          ref: 72ce14cb7b3c11350ca6f47a779480b5fc9bf912
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare pinned sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 72ce14cb7b3c11350ca6f47a779480b5fc9bf912
          python3 -m venv .validation-env
          .validation-env/bin/python -m pip install cmake==4.4.5 ninja==1.13.0 clang-format==20.1.8
          echo "$GITHUB_WORKSPACE/.validation-env/bin" >> "$GITHUB_PATH"
          mkdir -p validation-results
          "$CXX" --version > validation-results/compiler.txt
          .validation-env/bin/clang-format --dry-run --Werror src/constructors.cpp test/manifold_test.cpp
          git diff --check
          git worktree add --detach ../decompose-base 7095f37daf522628115b366d82735ab1b97622a1
      - name: Build baseline and verify decomposition controls
        shell: bash
        run: |
          set -euo pipefail
          cmake -S ../decompose-base -B build-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DMANIFOLD_TEST=ON -DMANIFOLD_PAR=OFF -DMANIFOLD_CBIND=ON -DMANIFOLD_PYBIND=OFF -DMANIFOLD_DEBUG=ON -DMANIFOLD_ASSERT=ON -DMANIFOLD_STRICT=ON 2>&1 | tee validation-results/base-configure.log
          cmake --build build-base --parallel 2 2>&1 | tee validation-results/base-build.log
          build-base/test/manifold_test --gtest_filter='Manifold.Decompose*' --gtest_output=xml:validation-results/base-decomposition.xml 2>&1 | tee validation-results/base-decomposition.log
      - name: Build exact candidate and run full native suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-fixed -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DMANIFOLD_TEST=ON -DMANIFOLD_PAR=OFF -DMANIFOLD_CBIND=ON -DMANIFOLD_PYBIND=OFF -DMANIFOLD_DEBUG=ON -DMANIFOLD_ASSERT=ON -DMANIFOLD_STRICT=ON 2>&1 | tee validation-results/fixed-configure.log
          cmake --build build-fixed --parallel 2 2>&1 | tee validation-results/fixed-build.log
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build-base/src" ldd build-fixed/test/manifold_test > validation-results/baseline-test-loader.txt
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build-base/src" build-fixed/test/manifold_test --gtest_filter='Manifold.Decompose*' --gtest_output=xml:validation-results/base-extended.xml 2>&1 | tee validation-results/base-extended.log
          ctest --test-dir build-fixed --output-on-failure --parallel 2 --output-junit "$GITHUB_WORKSPACE/validation-results/full-native.xml" 2>&1 | tee validation-results/full-native.log
          git diff --exit-code
      - name: Prepare public Decompose benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat > validation-results/probe.cpp <<'CPP'
          #include <algorithm>
          #include <chrono>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <string>
          #include <type_traits>
          #include <vector>
          #include "manifold/manifold.h"
          using namespace manifold;
          template <typename T>
          void Write(FILE* output, const std::vector<T>& data) {
            std::fprintf(output, "%zu\n", data.size());
            for (const T value : data) {
              if constexpr (std::is_floating_point<T>::value) {
                uint64_t bits;
                const double d = value;
                std::memcpy(&bits, &d, sizeof(bits));
                std::fprintf(output, "%016llx ", static_cast<unsigned long long>(bits));
              } else {
                std::fprintf(output, "%llu ", static_cast<unsigned long long>(value));
              }
            }
            std::fprintf(output, "\n");
          }
          void WriteMesh(FILE* output, const MeshGL64& mesh) {
            std::fprintf(output, "%u\n", mesh.numProp);
            Write(output, mesh.vertProperties);
            Write(output, mesh.triVerts);
            Write(output, mesh.mergeFromVert);
            Write(output, mesh.mergeToVert);
            Write(output, mesh.runIndex);
            Write(output, mesh.runOriginalID);
            Write(output, mesh.runTransform);
            Write(output, mesh.runFlags);
            Write(output, mesh.faceID);
            Write(output, mesh.halfedgeTangent);
          }
          Manifold Assemble(int count, int kind) {
            std::vector<Manifold> inputs;
            inputs.reserve(count);
            for (int i = 0; i < count; ++i) {
              Manifold shape = kind == 0 ? Manifold::Tetrahedron()
                               : kind == 1 ? Manifold::Sphere(1, 64)
                               : kind == 2 ? Manifold::Cube().CalculateNormals()
                               : i % 3 == 0 ? Manifold::Cube()
                               : i % 3 == 1 ? Manifold::Tetrahedron()
                                            : Manifold::Sphere(1, 12);
              if (kind == 3) {
                shape = shape.SetProperties(4, [i](double* properties, vec3 position, const double*) {
                  properties[0] = position.x;
                  properties[1] = position.y;
                  properties[2] = position.z;
                  properties[3] = i;
                });
              }
              inputs.push_back(shape.Translate({5.0 * (i % 64), 5.0 * (i / 64), 0}).AsOriginal());
            }
            return Manifold::BatchBoolean(inputs, OpType::Add);
          }
          int main(int argc, char** argv) {
            if (argc != 2) return 1;
            struct Case { const char* name; Manifold solid; size_t components; int calls; };
            const std::vector<Case> cases = {
                {"empty", Manifold(), 0, 10000},
                {"connected_sphere", Manifold::Sphere(1, 64), 1, 300},
                {"tetrahedra2", Assemble(2, 0), 2, 1000},
                {"tetrahedra16", Assemble(16, 0), 16, 300},
                {"tetrahedra128", Assemble(128, 0), 128, 100},
                {"tetrahedra512", Assemble(512, 0), 512, 30},
                {"tetrahedra2048", Assemble(2048, 0), 2048, 6},
                {"spheres2", Assemble(2, 1), 2, 100},
                {"spheres8", Assemble(8, 1), 8, 30},
                {"spheres32", Assemble(32, 1), 32, 10},
                {"normals128", Assemble(128, 2), 128, 50},
                {"mixed24", Assemble(24, 3), 24, 100},
            };
            for (const auto& example : cases) {
              if (example.solid.Status() != Manifold::Error::NoError) return 2;
              const size_t triangles = example.solid.NumTri();
              const double volume = example.solid.Volume();
              const auto expected = example.solid.Decompose();
              if (expected.size() != example.components) return 3;
              const std::string path = std::string(argv[1]) + "/" + example.name + ".txt";
              FILE* output = std::fopen(path.c_str(), "w");
              if (!output) return 4;
              std::fprintf(output, "%zu\n", expected.size());
              size_t recoveredTriangles = 0;
              double recoveredVolume = 0;
              for (const auto& part : expected) {
                if (part.Status() != Manifold::Error::NoError) return 5;
                recoveredTriangles += part.NumTri();
                recoveredVolume += part.Volume();
                WriteMesh(output, part.GetMeshGL64());
              }
              if (std::fclose(output) != 0) return 6;
              if (recoveredTriangles != triangles || std::abs(recoveredVolume - volume) > 1e-9 * std::max(1.0, std::abs(volume))) return 7;
              for (int i = 0; i < 5; ++i) {
                if (example.solid.Decompose().size() != example.components) return 8;
              }
              std::vector<double> samples;
              size_t observed = 0;
              for (int sample = 0; sample < 7; ++sample) {
                const auto start = std::chrono::steady_clock::now();
                for (int call = 0; call < example.calls; ++call) {
                  const auto decomposed = example.solid.Decompose();
                  observed += decomposed.size();
                }
                const auto finish = std::chrono::steady_clock::now();
                samples.push_back(std::chrono::duration<double, std::micro>(finish - start).count() / example.calls);
              }
              if (observed != example.components * example.calls * 7) return 9;
              std::printf("%s %zu %zu", example.name, triangles, example.components);
              for (const double sample : samples) std::printf(" %.6f", sample);
              std::printf("\n");
              std::fflush(stdout);
            }
          }
          CPP
          cat > validation-results/benchmark.py <<'PY'
          import hashlib
          import json
          import os
          import platform
          import statistics
          import subprocess
          from pathlib import Path
          root = Path("validation-results").resolve()
          cpu = min(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {cpu})
          records = {}
          for pair in range(5):
              for label in (("base", "fixed") if pair % 2 == 0 else ("fixed", "base")):
                  env = os.environ.copy()
                  env["LD_LIBRARY_PATH"] = str(Path("build-" + label + "/src").resolve())
                  directory = root / f"meshes-{label}-{pair}"
                  directory.mkdir()
                  (root / f"{label}-loader.txt").write_text(subprocess.check_output(["ldd", str(root / "probe")], env=env, text=True))
                  completed = subprocess.run([str(root / "probe"), str(directory)], env=env, capture_output=True, text=True, check=True)
                  (root / f"{label}-{pair}.txt").write_text(completed.stdout)
                  (root / f"{label}-{pair}.stderr").write_text(completed.stderr)
                  rows = {}
                  for line in completed.stdout.splitlines():
                      fields = line.split()
                      rows[fields[0]] = {"triangles": int(fields[1]), "components": int(fields[2]),
                                         "samples_us": list(map(float, fields[3:]))}
                  assert len(rows) == 12
                  records[(label, pair)] = rows
                  print(label, pair, "complete", flush=True)
          summary = []
          for name, expected in records[("base", 0)].items():
              serialized = (root / "meshes-base-0" / f"{name}.txt").read_bytes()
              result = {"name": name, "triangles": expected["triangles"], "components": expected["components"],
                        "mesh_sha256": hashlib.sha256(serialized).hexdigest()}
              for label in ("base", "fixed"):
                  rows = []
                  for pair in range(5):
                      actual = records[(label, pair)][name]
                      assert actual["triangles"] == expected["triangles"]
                      assert actual["components"] == expected["components"]
                      assert (root / f"meshes-{label}-{pair}" / f"{name}.txt").read_bytes() == serialized, (name, label, pair)
                      rows.append({"median_us": statistics.median(actual["samples_us"]), "samples_us": actual["samples_us"]})
                  result[label + "_pairs"] = rows
                  result[label + "_median_us"] = statistics.median(row["median_us"] for row in rows)
              result["time_change_percent"] = 100 * (result["fixed_median_us"] / result["base_median_us"] - 1)
              summary.append(result)
          report = {"base": "7095f37daf522628115b366d82735ab1b97622a1",
                    "candidate": "72ce14cb7b3c11350ca6f47a779480b5fc9bf912", "platform": platform.platform(), "affinity_cpu": cpu, "results": summary}
          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          for row in summary:
              print(row["name"], row["triangles"], row["components"], row["base_median_us"], row["fixed_median_us"], row["time_change_percent"])
          PY
          "$CXX" -std=c++17 -O3 validation-results/probe.cpp -Iinclude -Ibuild-fixed/include -Lbuild-fixed/src -Wl,-rpath,"$GITHUB_WORKSPACE/build-fixed/src" -lmanifold -o validation-results/probe
      - name: Compare complete outputs and repeated public API measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 validation-results/benchmark.py | tee validation-results/benchmark.log
          sha256sum ../decompose-base/src/constructors.cpp src/constructors.cpp build-base/src/libmanifold.so.3.5.1 build-fixed/src/libmanifold.so.3.5.1 > validation-results/source-library-hashes.txt
          git diff --exit-code
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grouped-decomposition-72ce14c
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
