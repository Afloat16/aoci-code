name: Verify Firecrawl batch chunk validation

on:
  push:
    branches: [validation/firecrawl-chunk-size-20261119]

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Afloat16/firecrawl
          ref: f77da8db31deb3793672e1addb0e25eaf125984e
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install SDK and test dependencies
        working-directory: apps/python-sdk
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify regression fails on unchanged upstream
        working-directory: apps/python-sdk
        run: |
          git show 1510bc4fff9c7014f6fa5be0f821ece168a69d13:apps/python-sdk/firecrawl/v2/methods/batch.py > firecrawl/v2/methods/batch.py
          set +e
          python -m pytest firecrawl/__tests__/unit/v2/methods/test_large_batch_chunks.py -q
          result=$?
          set -e
          git restore firecrawl/v2/methods/batch.py
          test "$result" -eq 1
      - name: Run complete SDK unit suite against fixed source
        working-directory: apps/python-sdk
        run: python -m pytest firecrawl/__tests__/unit -q
      - name: Check source cleanliness
        run: |
          test "$(git rev-parse HEAD)" = f77da8db31deb3793672e1addb0e25eaf125984e
          git diff --check HEAD^ HEAD
          git diff --exit-code
