name: Explore separable depth rays
on:
  push:
    branches: [validation/depth-rays-probe-20261119]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kornia/kornia
          ref: 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: validation-harness
          persist-credentials: false
          sparse-checkout: validation
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.40.0
          cache: false
      - name: Baseline and public depth API probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-results
          pixi run -e py312 install
          .venv-py312/bin/python -u - < validation-harness/validation/probe_depth.py 2>&1 | tee validation-results/probe.log
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: depth-rays-exploratory-probe
          path: validation-results/
          retention-days: 14
