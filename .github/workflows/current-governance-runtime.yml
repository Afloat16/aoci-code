name: current-governance-runtime
on:
  push:
    branches: [validation/current-governance-runtime-20261119]
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2a8a809dcbeb406ee9493551a4d5c698a1901d9c
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact current runtime
        run: |
          test "$(git rev-parse HEAD)" = 2a8a809dcbeb406ee9493551a4d5c698a1901d9c
          make build
          sha256sum build/aoci > build/aoci.sha256
          build/aoci --version
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aoci-current-runtime-2a8a809
          path: |
            build/aoci
            build/aoci.sha256
          retention-days: 7
          if-no-files-found: error
