name: Validate MinGap squared-bound review
on:
  push:
    branches: [validation/manifold-mingap-review-20261119]
permissions:
  contents: read
concurrency:
  group: validation-manifold-mingap-review-20261119
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/manifold
          ref: 2d2b2be74edbe8dfeb6d9653e2d3cabfe2ce9777
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare pinned build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2d2b2be74edbe8dfeb6d9653e2d3cabfe2ce9777
          python3 -m venv .validation-env
          .validation-env/bin/python -m pip install cmake==4.4.5 ninja==1.13.0 clang-format==20.1.8
          echo "$GITHUB_WORKSPACE/.validation-env/bin" >> "$GITHUB_PATH"
          mkdir -p validation-results
          "$CXX" --version > validation-results/compiler.txt
          git show HEAD:src/manifold.cpp > ../mingap-reviewed.cpp
          git show HEAD^:src/manifold.cpp > src/manifold.cpp
      - name: Validate unchanged PR implementation with the extended tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DMANIFOLD_TEST=ON -DMANIFOLD_PAR=OFF -DMANIFOLD_CBIND=ON -DMANIFOLD_PYBIND=OFF -DMANIFOLD_DEBUG=ON -DMANIFOLD_ASSERT=ON -DMANIFOLD_STRICT=ON 2>&1 | tee validation-results/configure.log
          cmake --build build --parallel 2 2>&1 | tee validation-results/base-build.log
          build/test/manifold_test --gtest_filter='Measurement.*' --gtest_output=xml:validation-results/base-measurement.xml 2>&1 | tee validation-results/base-measurement.log
      - name: Demonstrate the zero-gap guard is needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("../mingap-reviewed.cpp").read_text()
          old = "searchLength > 0 && gapSquared > 0 &&"
          assert source.count(old) == 1
          Path("src/manifold.cpp").write_text(source.replace(old, "searchLength > 0 &&"))
          PY
          cmake --build build --parallel 2 2>&1 | tee validation-results/unguarded-build.log
          set +e
          build/test/manifold_test --gtest_filter=Measurement.MinGapBoundingBoxTouchingAndContained --gtest_output=xml:validation-results/unguarded.xml > validation-results/unguarded.log 2>&1
          status=$?
          set -e
          cat validation-results/unguarded.log
          test "$status" -eq 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("validation-results/unguarded.xml").getroot()
          assert root.attrib["tests"] == "1"
          assert root.attrib["failures"] == "1"
          failures = root.findall(".//failure")
          assert len(failures) == 2, [node.attrib for node in failures]
          PY
      - name: Validate exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cp ../mingap-reviewed.cpp src/manifold.cpp
          git diff --exit-code
          cmake --build build --parallel 2 2>&1 | tee validation-results/fixed-build.log
          build/test/manifold_test --gtest_filter='Measurement.*' --gtest_output=xml:validation-results/fixed-measurement.xml 2>&1 | tee validation-results/fixed-measurement.log
          ctest --test-dir build --output-on-failure --parallel 2 --output-junit "$GITHUB_WORKSPACE/validation-results/full-native.xml" 2>&1 | tee validation-results/full-native.log
          clang-format --dry-run --Werror src/manifold.cpp test/measurement_test.cpp
          git diff --check
          git diff --exit-code
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mingap-review-2d2b2be
          path: validation-results/
          if-no-files-found: error
          retention-days: 14
