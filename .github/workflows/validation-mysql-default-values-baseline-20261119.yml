name: Reproduce MySQL default value loss on upstream
on:
  push:
    branches: [validation/mysql-default-values-baseline-20261119]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: false
      - name: Prove production source equals upstream
        run: |
          test "$(git rev-parse HEAD^)" = fda12baa06d9f95ebb38d1029879cfd1c92d7bd1
          git diff --exit-code HEAD^ -- internal/dbevidence/canonical.go internal/dbevidence/collector_mysql.go internal/dbevidence/queries.go internal/dbevidence/types.go
          test -z "$(gofmt -l internal/dbevidence/canonical_mysql_defaults_test.go internal/dbevidence/mysql_defaults_integration_test.go)"
      - name: Start disposable MySQL
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name aoci-mysql-defaults -e MYSQL_ROOT_PASSWORD="$password" -e MYSQL_DATABASE=aoci_test -p 127.0.0.1::3306 "$MYSQL_IMAGE"
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$password" aoci-mysql-defaults mysqladmin --protocol=tcp -h 127.0.0.1 -uroot ping --silent; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          port="$(docker port aoci-mysql-defaults 3306/tcp | cut -d: -f2)"
          echo "AOCI_TEST_MYSQL_ADMIN_DSN=root:$password@tcp(127.0.0.1:$port)/aoci_test" >> "$GITHUB_ENV"
      - name: Require reproducible unit failures
        run: |
          log="$RUNNER_TEMP/mysql-default-baseline-unit.log"
          if go test -v -count=1 ./internal/dbevidence -run '^TestCanonicalMySQLDefault' > "$log" 2>&1; then
            cat "$log"
            echo "Expected the unchanged upstream default canonicalizer to fail"
            exit 1
          fi
          cat "$log"
          grep -F 'catalog default changed during canonicalization' "$log"
          grep -F 'distinct MySQL default values collapsed' "$log"
          ! grep -F '[build failed]' "$log"
      - name: Require real catalog failures
        run: |
          log="$RUNNER_TEMP/mysql-default-baseline-real.log"
          if go test -v -count=1 -tags=integration ./internal/dbevidence -run '^TestMySQLDefaultValuesPreserveCatalogBytesAndDrift$' > "$log" 2>&1; then
            cat "$log"
            echo "Expected the unchanged upstream default canonicalizer to fail"
            exit 1
          fi
          cat "$log"
          test "$(grep -c 'catalog default changed during canonicalization' "$log")" -eq 3
          ! grep -E 'SKIP|\[build failed\]' "$log"
      - name: Require unchanged tracked source
        if: always()
        run: git diff --exit-code
      - name: Stop disposable MySQL
        if: always()
        run: docker rm -f aoci-mysql-defaults
