name: bounded-recent-ledger-validation

on:
  push:
    branches: [validation/bounded-ledger-current-gates-20261119]

permissions:
  contents: read

jobs:
  fast:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 397d79113e76952ba4bd02864d414c18e810dda5
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = 397d79113e76952ba4bd02864d414c18e810dda5
      - name: Run ordinary contribution gate
        run: make fast
      - name: Check source bytes
        if: always()
        run: git diff --exit-code

  verify:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 397d79113e76952ba4bd02864d414c18e810dda5
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = 397d79113e76952ba4bd02864d414c18e810dda5
      - name: Install the repository's pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/go-licenses@v1.6.0
      - name: Run complete deterministic closure
        run: make verify
      - name: Check aligned index
        if: always()
        run: bash scripts/check-index-quality.sh build/aoci
      - name: Check source bytes
        if: always()
        run: git diff --exit-code

  regression:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 397d79113e76952ba4bd02864d414c18e810dda5
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = 397d79113e76952ba4bd02864d414c18e810dda5
      - name: Prove upstream retains discarded history
        shell: bash
        run: |
          git show 2a8a809dcbeb406ee9493551a4d5c698a1901d9c:internal/ledger/ledger.go > internal/ledger/ledger.go
          set +e
          go test -count=1 -v ./internal/ledger -run '^TestRecentLimitedHistoryDoesNotRetainDiscardedEvents$' > "$RUNNER_TEMP/ledger-before.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ledger-before.log"
          test "$status" -eq 1
          grep -F -- '--- FAIL: TestRecentLimitedHistoryDoesNotRetainDiscardedEvents' "$RUNNER_TEMP/ledger-before.log"
          go test -run '^$' -bench '^BenchmarkRecentLimitedHistory$' -benchmem -count=1 ./internal/ledger
          git restore --source=397d79113e76952ba4bd02864d414c18e810dda5 -- internal/ledger/ledger.go
      - name: Verify bounded retention and record fixed benchmark
        run: go test -count=1 -v -bench '^BenchmarkRecentLimitedHistory$' -benchmem ./internal/ledger
      - name: Check source bytes
        if: always()
        run: git diff --exit-code

