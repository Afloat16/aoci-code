name: Validate connected component label buffers
on:
  push:
    branches: [validation/connected-label-buffers-final-20261120]
permissions:
  contents: read
concurrency:
  group: validation-connected-label-buffers-final-20261120
  cancel-in-progress: true
jobs:
  quality:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_NO_SYNC: "1"
      KORNIA_TEST_DEVICE: cpu
      KORNIA_TEST_DTYPE: float64
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: 0d684f8ff301861768f16c8fe058942d34a8e253
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: validation-harness
          persist-credentials: false
          sparse-checkout: validation
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.40.0
          cache: false
      - name: Prepare exact source and locked environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d684f8ff301861768f16c8fe058942d34a8e253
          mkdir -p validation-results
          git show 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33:kornia/contrib/connected_components.py > validation-results/connected_components-base.py
          pixi run -e py312 install
          .venv-py312/bin/python -c 'import sys, torch, kornia; from pathlib import Path; print(sys.executable, sys.version, torch.__version__, kornia.__file__); assert sys.version_info[:2] == (3,12); assert Path(kornia.__file__).resolve() == Path("kornia/__init__.py").resolve()' | tee validation-results/environment.log
          git diff --check
      - name: Current Torch exact API, transformations and module regressions
        shell: bash
        run: |
          set -euo pipefail
          .venv-py312/bin/python -u - < validation-harness/validation/connected-label-compatibility.py 2>&1 | tee validation-results/compatibility-current.log
          KORNIA_TEST_OPTIMIZER=inductor pixi run -e py312 test-module tests/contrib/test_connected_component.py tests/contrib/test_connected_components_union_find.py --device=cpu --dtype=float32,float64 --timeout=600 -q -ra --junitxml=validation-results/current-modules.xml 2>&1 | tee validation-results/current-modules.log
      - name: Full repository hooks, type checks and selected promised packages
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e py312 pre-commit-all 2>&1 | tee validation-results/pre-commit.log
          pixi run -e py312 typecheck 2>&1 | tee validation-results/typecheck.log
          pixi run -e py312 changelog-preview > validation-results/changelog-preview.log 2>&1
          git diff 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33 HEAD --name-only --no-renames > validation-results/changed-paths.txt
          for kind in compile onnx; do
            packages=$(.venv-py312/bin/python .github/scripts/conformance_packages.py "$kind" < validation-results/changed-paths.txt)
            .venv-py312/bin/python .github/scripts/conformance_packages.py "$kind" < validation-results/changed-paths.txt > "validation-results/$kind-packages.txt"
            if [ -z "$packages" ]; then
              echo "$kind: no affected promised stable-core operator" | tee "validation-results/$kind.log"
              continue
            fi
            if [ "$kind" = compile ]; then test_file=tests/test_inductor_conformance.py; else test_file=tests/onnx/test_conformance.py; fi
            pixi run -e py312 test-module "$test_file" "--$kind-conformance=$packages" --device=cpu --dtype=float64 --timeout=600 -q -ra "--junitxml=validation-results/$kind.xml" 2>&1 | tee "validation-results/$kind.log"
          done
          git diff --exit-code
      - name: Validate minimum supported Torch without orphan compiler sidecars
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e py312 uv run --no-sync uv pip install --reinstall-package torch --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          .venv-py312/bin/python .github/scripts/check_torch_env.py --list-undeclared-sidecars | tee validation-results/sidecars-before.log
          pixi run -e py312 uv run --no-sync uv pip uninstall triton
          .venv-py312/bin/python .github/scripts/check_torch_env.py --channel pinned --expected 2.5.1 | tee validation-results/minimum-environment.log
          .venv-py312/bin/python -u - < validation-harness/validation/connected-label-compatibility.py 2>&1 | tee validation-results/compatibility-minimum.log
          KORNIA_TEST_OPTIMIZER=inductor pixi run -e py312 test-module tests/contrib/test_connected_component.py tests/contrib/test_connected_components_union_find.py --device=cpu --dtype=float32,float64 --timeout=600 -q -ra --junitxml=validation-results/minimum-modules.xml 2>&1 | tee validation-results/minimum-modules.log
          git diff --exit-code
          sha256sum kornia/contrib/connected_components.py > validation-results/final-source-hash.txt
      - name: Save exact-source validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-label-quality-0d684f8
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
  benchmark:
    if: github.repository == 'Afloat16/aoci-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UV_NO_SYNC: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: 0d684f8ff301861768f16c8fe058942d34a8e253
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: validation-harness
          persist-credentials: false
          sparse-checkout: validation
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.40.0
          cache: false
      - name: Prepare and verify both complete source checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d684f8ff301861768f16c8fe058942d34a8e253
          mkdir -p validation-results
          git worktree add --detach baseline-source 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33
          pixi run -e py312 install
          comparison_python="$PWD/.venv-py312/bin/python"
          "$comparison_python" -c 'import sys, kornia; from pathlib import Path; print(sys.executable, kornia.__file__); assert Path(kornia.__file__).resolve() == Path("kornia/__init__.py").resolve()' | tee validation-results/candidate-provenance.log
          (
            cd baseline-source
            "$comparison_python" -c 'import sys, kornia; from pathlib import Path; print(sys.executable, kornia.__file__); assert Path(kornia.__file__).resolve() == Path("kornia/__init__.py").resolve()'
          ) | tee validation-results/base-provenance.log
          test "$(git -C baseline-source rev-parse HEAD)" = 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33
          git diff --check
      - name: Twenty alternating rounds and three raw allocation samples per workload
        shell: bash
        run: |
          set -euo pipefail
          .venv-py312/bin/python -u - < validation-harness/validation/connected-label-benchmark.py 2>&1 | tee validation-results/benchmark.log
          git diff --exit-code
          git -C baseline-source diff --exit-code
      - name: Save measurements and raw traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-label-benchmark-0d684f8
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
